  <header class="en-tete">

      <nav aria-label="Navigation principale">

    </div>
  </header>
  <main>
    <section class="form-container">
      <FORM method="post" action="#">
        <h2>Envoyez-nous un message</h2>
        <label for="nom">Nom complet *</label>
        <input type="text" id="nom" name="nom" placeholder="Ex. Mariem Aits" required>
        <label for="tel">Numero de telephone</label>
        <input type="tel" id="tel" name="tel" placeholder="+212 600 000 000">
        <label for="email">Adresse e-mail *</label>
        <input type="email" id="email" name="email" placeholder="ex mariem@gmail.com">
        <div class="dropdown">
          <label for="object">Objet de votre demande</label>
          <select name="" id="object" required>
            <option value="" disabled selected>Sélectionnez une option</option>
            <option value="Abonnement">Abonnement & Tarifs (Mensuel / Annuel)</option>
            <option value="coaching">Coaching individuel personnalisé (Personal Training)</option>
            <option value="cours">Cours collectifs (CrossFit, HIIT, Spinning, Yoga)</option>
            <option value="autre">Autre renseignement / Question générale</option>
          </select>
        </div>
        <label for="message">Votre message</label>
        <textarea id="message" name="message" rows="4" placeholder="Écrivez votre message ici..." required></textarea>
        <button type="submit">ENVOYER LA DEMANDE</button>
      </FORM>
    </section>
  </main>
